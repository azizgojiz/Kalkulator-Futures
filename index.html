<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Futures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF1F5;
    --panel: #FFFFFF;
    --panel-border: #E1E6EC;
    --ink: #14202E;
    --muted: #647087;
    --brass: #2A6996;
    --brass-soft: rgba(42,105,150,0.10);
    --teal: #2A6996;
    --teal-soft: rgba(42,105,150,0.10);
    --green: #1B8F5A;
    --green-soft: rgba(27,143,90,0.10);
    --red: #C6414B;
    --red-soft: rgba(198,65,75,0.10);
    --mono: 'IBM Plex Mono', 'SF Mono', Consolas, Menlo, monospace;
    --shadow-rest: 0 1px 2px rgba(20,32,46,0.04);
    --shadow-hover: 0 14px 32px rgba(20,32,46,0.10);
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{ max-width: 900px; margin: 0 auto; padding: 48px 20px 64px; }

  header{
    position: relative;
    margin-bottom: 28px;
    padding: 44px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    border-radius: 22px;
    overflow: hidden;
    background:
      radial-gradient(circle at 1.5px 1.5px, rgba(20,32,46,0.14) 1.4px, transparent 0) 0 0/26px 26px,
      linear-gradient(180deg, #F6F8FA, #EEF1F5 75%);
    border: 1px solid var(--panel-border);
  }
  header::after{
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 55% at 50% 0%, rgba(238,241,245,0) 0%, var(--bg) 92%);
    pointer-events: none;
  }
  .hero-text{ position: relative; z-index: 1; }

  h1{
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700;
    font-size: clamp(30px, 5vw, 44px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
    color: var(--ink);
  }
  .lede{
    font-size: 15px;
    line-height: 1.6;
    color: var(--muted);
    max-width: 46ch;
    margin: 0 auto;
  }

  .tabs{
    display: inline-flex; gap: 4px; background: var(--panel);
    border: 1px solid var(--panel-border); box-shadow: var(--shadow-rest);
    border-radius: 100px; padding: 4px; margin-top: 22px;
  }
  .tabs button{
    padding: 10px 20px; border: none; border-radius: 100px; background: transparent;
    color: var(--muted); font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 13.5px;
    cursor: pointer; transition: .2s;
  }
  .tabs button.active{ background: var(--brass); color: #fff; }

  .tabpanel{ display: none; }
  .tabpanel.active{ display: block; }

  .grid2{ display: grid; grid-template-columns: 1fr 1.3fr; gap: 18px; }
  @media (max-width: 720px){ .grid2{ grid-template-columns: 1fr; } }

  .card{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 26px;
    box-shadow: var(--shadow-rest);
  }

  .card-title{
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    font-size: 15.5px;
    color: var(--brass);
    margin: 0 0 16px;
  }

  .seg{
    display: flex; background: var(--bg); border: 1px solid var(--panel-border);
    border-radius: 100px; padding: 4px; margin-bottom: 18px;
  }
  .seg button{
    flex: 1; padding: 9px; border: none; border-radius: 100px; background: transparent;
    color: var(--muted); font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 13px;
    cursor: pointer; transition: .2s;
  }
  .seg button.active{ background: var(--brass); color: #fff; }

  .field{ margin-bottom: 14px; }
  .field label{ display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  .field input{
    width: 100%; background: var(--bg); border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 11px 13px; color: var(--ink);
    font-family: var(--mono); font-size: 14px;
  }
  .field input:focus{ outline: none; border-color: var(--brass); }

  .metrics{ display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .metric{
    background: var(--teal-soft); border-radius: 14px;
    padding: 16px 18px;
  }
  .metric.pos{ background: var(--green-soft); }
  .metric.neg{ background: var(--red-soft); }
  .metric .m-label{ font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .metric .m-value{ font-family: var(--mono); font-size: 19px; font-weight: 700; color: var(--ink); }
  .metric .m-value.green{ color: var(--green); }
  .metric .m-value.red{ color: var(--red); }

  .error{
    background: var(--red-soft); color: var(--red); border: 1px solid rgba(198,65,75,0.25);
    border-radius: 12px; padding: 13px 16px; font-size: 13.5px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="hero-text">
      <h1>Kalkulator Futures</h1>
      <p class="lede">Hitung leverage yang pas atau proyeksi PnL sebelum masuk posisi.</p>
      <div class="tabs">
        <button id="tabBtnLev" class="active" onclick="switchTab('lev')">Kalkulator Leverage</button>
        <button id="tabBtnPnl" onclick="switchTab('pnl')">Kalkulator PnL</button>
      </div>
    </div>
  </header>

  <!-- ===================== TAB LEVERAGE ===================== -->
  <div id="tabLev" class="tabpanel active">
    <div class="grid2">
      <div class="card">
        <div class="card-title">Input posisi</div>
        <div class="seg">
          <button id="levLong" class="active" onclick="setLevPos('long')">long</button>
          <button id="levShort" onclick="setLevPos('short')">short</button>
        </div>
        <div class="field"><label>Harga Entry</label><input type="number" id="levEntry" value="0.01385" step="any" oninput="calcLev()"></div>
        <div class="field"><label>Target (TP)</label><input type="number" id="levTp" value="0.0162" step="any" oninput="calcLev()"></div>
        <div class="field"><label>Stop Loss (SL)</label><input type="number" id="levSl" value="0.013385" step="any" oninput="calcLev()"></div>
        <div class="field"><label>Margin (USD)</label><input type="number" id="levMargin" value="1000" step="any" oninput="calcLev()"></div>
        <div class="field"><label>Toleransi Kerugian Maksimum (USD)</label><input type="number" id="levMaxloss" value="500" step="any" oninput="calcLev()"></div>
      </div>
      <div class="card">
        <div class="card-title">Hasil perhitungan</div>
        <div id="levOut"></div>
      </div>
    </div>
  </div>

  <!-- ===================== TAB PNL ===================== -->
  <div id="tabPnl" class="tabpanel">
    <div class="grid2">
      <div class="card">
        <div class="card-title">Input posisi</div>
        <div class="seg">
          <button id="pnlLong" class="active" onclick="setPnlPos('long')">long</button>
          <button id="pnlShort" onclick="setPnlPos('short')">short</button>
        </div>
        <div class="field"><label>Entry Price</label><input type="number" id="pnlEntry" value="0.01" step="any" oninput="calcPnl()"></div>
        <div class="field"><label>Target Price (TP)</label><input type="number" id="pnlTp" value="0.02" step="any" oninput="calcPnl()"></div>
        <div class="field"><label>Stop Loss (SL)</label><input type="number" id="pnlSl" value="0.009" step="any" oninput="calcPnl()"></div>
        <div class="field"><label>Margin (USDT)</label><input type="number" id="pnlMargin" value="1000" step="any" oninput="calcPnl()"></div>
        <div class="field"><label>Leverage (X)</label><input type="number" id="pnlLeverage" value="5" step="any" oninput="calcPnl()"></div>
      </div>
      <div class="card">
        <div class="card-title">Hasil perhitungan</div>
        <div id="pnlOut"></div>
      </div>
    </div>
  </div>

</div>

<script>
function switchTab(t){
  document.getElementById('tabBtnLev').classList.toggle('active', t==='lev');
  document.getElementById('tabBtnPnl').classList.toggle('active', t==='pnl');
  document.getElementById('tabLev').classList.toggle('active', t==='lev');
  document.getElementById('tabPnl').classList.toggle('active', t==='pnl');
}

function fmtUsd(n){
  if(!isFinite(n)) return '—';
  return '$' + n.toLocaleString('en-US', {maximumFractionDigits:2});
}
function fmtNum(n, digits){
  if(!isFinite(n)) return '—';
  return n.toLocaleString('en-US', {maximumFractionDigits: digits===undefined?2:digits});
}

// ---------- Kalkulator Leverage ----------
let levPos = 'long';
function setLevPos(p){
  levPos = p;
  document.getElementById('levLong').classList.toggle('active', p==='long');
  document.getElementById('levShort').classList.toggle('active', p==='short');
  calcLev();
}
function calcLev(){
  const entry = parseFloat(document.getElementById('levEntry').value);
  const tp = parseFloat(document.getElementById('levTp').value);
  const sl = parseFloat(document.getElementById('levSl').value);
  const margin = parseFloat(document.getElementById('levMargin').value);
  const maxLoss = parseFloat(document.getElementById('levMaxloss').value);
  const out = document.getElementById('levOut');

  if(![entry,tp,sl,margin,maxLoss].every(isFinite)){
    out.innerHTML = '<div class="error">Isi semua kolom dengan angka yang valid.</div>';
    return;
  }

  const riskPerUnit = Math.abs(entry - sl);
  if(riskPerUnit === 0){
    out.innerHTML = '<div class="error">SL tidak boleh sama dengan entry (risk per unit = 0).</div>';
    return;
  }

  const coinAmount = maxLoss / riskPerUnit;
  const positionSize = coinAmount * entry;
  const leverage = positionSize / margin;
  const profit = levPos === 'long' ? (tp - entry) * coinAmount : (entry - tp) * coinAmount;
  const profitCardCls = profit >= 0 ? 'pos' : 'neg';
  const profitTextCls = profit >= 0 ? 'green' : 'red';

  out.innerHTML = `
    <div class="metrics">
      <div class="metric"><div class="m-label">Leverage</div><div class="m-value">${fmtNum(leverage)}x</div></div>
      <div class="metric"><div class="m-label">Ukuran posisi (USD)</div><div class="m-value">${fmtUsd(positionSize)}</div></div>
      <div class="metric ${profitCardCls}"><div class="m-label">Profit jika TP tercapai</div><div class="m-value ${profitTextCls}">${fmtUsd(profit)}</div></div>
      <div class="metric"><div class="m-label">Jumlah koin</div><div class="m-value">${fmtNum(coinAmount)}</div></div>
    </div>
  `;
}

// ---------- Kalkulator PnL ----------
let pnlPos = 'long';
function setPnlPos(p){
  pnlPos = p;
  document.getElementById('pnlLong').classList.toggle('active', p==='long');
  document.getElementById('pnlShort').classList.toggle('active', p==='short');
  calcPnl();
}
function calcPnl(){
  const entry = parseFloat(document.getElementById('pnlEntry').value);
  const tp = parseFloat(document.getElementById('pnlTp').value);
  const sl = parseFloat(document.getElementById('pnlSl').value);
  const margin = parseFloat(document.getElementById('pnlMargin').value);
  const leverage = parseFloat(document.getElementById('pnlLeverage').value);
  const out = document.getElementById('pnlOut');

  if(![entry,tp,sl,margin,leverage].every(isFinite)){
    out.innerHTML = '<div class="error">Isi semua kolom dengan angka yang valid.</div>';
    return;
  }
  if(entry === 0){
    out.innerHTML = '<div class="error">Entry price tidak boleh 0.</div>';
    return;
  }

  const positionSize = margin * leverage;
  const coinAmount = positionSize / entry;
  let profit, loss;
  if(pnlPos === 'long'){
    profit = (tp - entry) * coinAmount;
    loss = (entry - sl) * coinAmount;
  } else {
    profit = (entry - tp) * coinAmount;
    loss = (sl - entry) * coinAmount;
  }
  const profitCardCls = profit >= 0 ? 'pos' : 'neg';
  const profitTextCls = profit >= 0 ? 'green' : 'red';
  // loss > 0 = genuine loss (red). loss <= 0 means the SL side you set actually favors
  // this position, so it isn't a real loss (shown green).
  const lossCardCls = loss > 0 ? 'neg' : 'pos';
  const lossTextCls = loss > 0 ? 'red' : 'green';

  out.innerHTML = `
    <div class="metrics">
      <div class="metric ${profitCardCls}"><div class="m-label">Profit jika TP tercapai</div><div class="m-value ${profitTextCls}">${fmtUsd(profit)}</div></div>
      <div class="metric ${lossCardCls}"><div class="m-label">Kerugian jika SL kena</div><div class="m-value ${lossTextCls}">${fmtUsd(loss)}</div></div>
      <div class="metric"><div class="m-label">Ukuran Posisi (USDT)</div><div class="m-value">${fmtUsd(positionSize)}</div></div>
      <div class="metric"><div class="m-label">Jumlah Koin</div><div class="m-value">${fmtNum(coinAmount, 6)}</div></div>
    </div>
  `;
}

calcLev();
calcPnl();
</script>
</body>
</html>
