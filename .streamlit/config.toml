[theme]
base = "light"

# General color setup
textColor = "#14202E"
primaryColor = "#2A6996"
backgroundColor = "#EEF1F5"
secondaryBackgroundColor = "#FFFFFF"

# Widgets
showWidgetBorder = true
borderColor = "#E1E6EC"

# Dataframes
dataframeHeaderBackgroundColor = "#FFFFFF"

# Base text
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
baseFontWeight = 400
baseFontSize = 14

# Heading text
headingFont = "'Bricolage Grotesque':https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap"
headingFontWeights = [700, 600, 600, 600, 600, 600]
headingFontSizes = ["2.5rem", "1.5rem", "1rem"]
